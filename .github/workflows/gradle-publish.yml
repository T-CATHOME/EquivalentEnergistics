# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "1.7.10" ]
  pull_request:
    branches: [ "1.7.10" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
 
    - name: Fix QuanXian
      run: chmod 777 *

    - name: Fix Form
      run: ./gradlew :spotlessApply
      
    - name: Build with Gradle
      id: gradle-build
      run: |
        # 执行构建并捕获输出
        ./gradlew build --console=plain > build.log 2>&1
        # 从日志中提取主JAR路径
        JAR_PATH=$(grep -oP 'Building jar: \K.*?(?=\s)' build.log || true)
        
        # 如果未找到，使用备用方法查找
        if [ -z "$JAR_PATH" ]; then
          echo "Using fallback JAR detection"
          JAR_PATH=$(find . -path "*/build/libs/*.jar" ! -name "*-*" ! -name "*plain*" | head -n 1)
        fi
        
        # 验证文件存在
        if [ ! -f "$JAR_PATH" ]; then
          echo "::error::JAR file not found: $JAR_PATH"
          exit 1
        fi
        
        echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
        echo "Detected JAR: $JAR_PATH"

    - name: Verify JAR file
      run: |
        echo "Verifying JAR: ${{ steps.gradle-build.outputs.jar_path }}"
        # 检查是否是有效的JAR文件
        if ! jar -tf "${{ steps.gradle-build.outputs.jar_path }}" > /dev/null; then
          echo "::error::Invalid JAR file"
          exit 1
        fi
        # 检查文件大小
        FILESIZE=$(stat -c%s "${{ steps.gradle-build.outputs.jar_path }}")
        if [ "$FILESIZE" -lt 10000 ]; then
          echo "::error::JAR file too small, likely incomplete"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: ${{ steps.gradle-build.outputs.jar_path }}
        retention-days: 7
    
    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
